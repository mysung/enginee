  <!-- Tailwind CSS CDN -->

  <!-- Google Fonts: Pretentard / Inter -->

      darkMode: 'class',

        extend: {
          fontFamily: {

      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0f19] text-slate-100 selection:bg-indigo-500 selection:text-white">

        <span>미니홈피 메인</span>

      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-sm shadow-sm">

    <div class="flex items-center gap-2">

      <a href="/" class="text-xs text-slate-400 hover:text-indigo-400 transition-colors flex items-center gap-1">

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">

    <!-- Top Banner -->
    <div class="p-5 rounded-2xl bg-gradient-to-r from-indigo-950/50 via-slate-900 to-slate-900 border border-indigo-500/30 shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

        <h2 class="text-lg font-bold text-white flex items-center gap-2">

        <p class="text-xs sm:text-sm text-slate-300 mt-1">

      </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

      <!-- Left: Pomodoro Timer (5 cols) -->
      <section class="lg:col-span-5 flex flex-col gap-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg items-center text-center justify-between">
        
        <!-- Mode Switcher Tabs -->
        <div class="w-full flex bg-slate-950 p-1.5 rounded-2xl border border-slate-800 gap-1">
          <button
            id="mode-pomodoro"
            onclick="setMode('pomodoro')"
            class="flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30 flex items-center justify-center gap-1.5"
          >
            <span>🍅 집중 (25분)</span>
          </button>
          <button
            id="mode-short"
            onclick="setMode('short')"

          <button
            id="mode-long"

      <section class="lg:col-span-7 flex flex-col gap-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-lg">
        
        <!-- Notepad Header & Actions -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-pen-to-square text-indigo-400"></i>

            <span id="save-indicator" class="text-[11px] text-emerald-400 flex items-center gap-1 font-medium">

              <i class="fa-solid fa-download"></i>

            <button onclick="clearNote()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 text-xs border border-slate-700 transition-colors" title="비우기">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Quick To-Do Tasks Section -->
        <div class="flex flex-col gap-2.5 p-3.5 rounded-xl bg-slate-950/70 border border-slate-800/80">
          <div class="flex items-center justify-between text-xs text-slate-300">
            <span class="font-bold flex items-center gap-1.5">
              <i class="fa-solid fa-list-check text-indigo-400"></i> 오늘의 집중 할 일
            </span>
            <span id="task-counter" class="text-[11px] text-slate-400">0/0 완료</span>
          </div>

          <!-- Add Task Input -->
          <form onsubmit="addTask(event)" class="flex gap-2">
            <input
              id="new-task-input"
              type="text"
              placeholder="이번 뽀모도로 동안 끝낼 할 일 입력..."
              class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-xs sm:text-sm text-slate-100 placeholder-slate-500 outline-none"
            />
            <button
              type="submit"
              class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-600/20 active:scale-95 transition-all flex items-center gap-1"
            >
              <i class="fa-solid fa-plus text-[11px]"></i>

          </form>

          <!-- Task List Container -->
          <div id="tasks-container" class="flex flex-col gap-1.5 max-h-36 overflow-y-auto chat-scroll pr-1">
            <!-- Dynamic task items -->
          </div>

        <!-- Markdown Quick Formatting Bar -->
        <div class="flex items-center gap-1.5 text-xs pt-1 flex-wrap">
          <span class="text-slate-400 text-[11px]">서식 도구:</span>
          <button onclick="insertFormat('checkbox')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono transition-colors">[ ] 체크</button>
          <button onclick="insertFormat('bullet')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono transition-colors">• 불릿</button>
          <button onclick="insertFormat('bold')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono transition-colors">**굵게**</button>
          <button onclick="insertFormat('timestamp')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono transition-colors">⏰ 현재시각</button>
        </div>

        <!-- Main Notepad Textarea -->
        <div class="flex-1 flex flex-col min-h-[220px]">
          <textarea
            id="notepad-text"
            rows="10"
            placeholder="떠오르는 아이디어, 회의 요약, 집중 메모를 자유롭게 적어보세요... 작성 즉시 브라우저에 안전하게 자동저장됩니다."
            class="w-full flex-1 p-4 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-100 placeholder-slate-500 text-sm leading-relaxed resize-y chat-scroll outline-none transition-all"
            oninput="handleNoteInput()"
          ></textarea>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
          <span id="note-char-count">0자 작성됨</span>
          <span class="text-[11px] text-slate-400">데이터는 브라우저 LocalStorage에 영구 보존됩니다</span>
        </div>

      </section>

    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl bg-slate-800 text-white border border-slate-700 shadow-2xl text-xs font-medium flex items-center gap-2 transform translate-y-8 opacity-0 pointer-events-none transition-all duration-300">
    <i class="fa-solid fa-circle-check text-indigo-400"></i>
    <span id="toast-text">알림 메시지</span>
  </div>

  <script>
    // ----------------------------------------------------
    // State & Constants
    // ----------------------------------------------------
    const DURATIONS = {
      pomodoro: 25 * 60,
      short: 5 * 60,
      long: 15 * 60
    };

    let currentMode = 'pomodoro';
    let timeLeft = DURATIONS.pomodoro;
    let timerInterval = null;
    let isRunning = false;
    let completedSessions = 0;
    let totalFocusSeconds = 0;
    let audioEnabled = true;

    // Load saved pomodoro stats
    try {
      completedSessions = parseInt(localStorage.getItem('pomodoro_sessions_count') || '0', 10);
      totalFocusSeconds = parseInt(localStorage.getItem('pomodoro_total_focus_sec') || '0', 10);
    } catch (e) {}

    // Load tasks
    let tasks = [];
    try {
      const storedTasks = localStorage.getItem('pomodoro_tasks_v1');
      if (storedTasks) {
        tasks = JSON.parse(storedTasks) || [];
      }
    } catch (e) {}

    // Audio synthesizer for soft bell / chime (Web Audio API)
    function playChimeSound() {
      if (!audioEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6 chime chord
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);

          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + idx * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 1.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 1.25);
        });
      } catch (e) {
        console.warn('Audio play error', e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('icon-audio');
      if (audioEnabled) {
        icon.className = 'fa-solid fa-volume-high text-indigo-400';
        showToast('알림음이 켜졌습니다. 🔔');
        playChimeSound();
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-slate-500';
        showToast('알림음이 꺼졌습니다. 🔇');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.remove('translate-y-8', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
      setTimeout(() => {
        toast.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
      }, 3000);
    }

    function updateStatsUI() {
      const badge = document.getElementById('session-count-badge');
      const totalEl = document.getElementById('total-focus-time');
      if (badge) badge.textContent = `🍅 ${completedSessions}개`;
      const minutes = Math.round(totalFocusSeconds / 60);
      if (totalEl) totalEl.textContent = `${minutes}분`;
    }

    function setMode(mode) {
      if (isRunning) {
        pauseTimer();
      }
      currentMode = mode;
      timeLeft = DURATIONS[mode];

      // Update Tab styling
      const modes = ['pomodoro', 'short', 'long'];
      modes.forEach(m => {
        const btn = document.getElementById('mode-' + m);
        if (btn) {
          if (m === mode) {
            btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30 flex items-center justify-center gap-1.5';
          } else {
            btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5';
          }
        }
      });

      const label = document.getElementById('current-mode-label');
      const ring = document.getElementById('timer-ring');
      if (mode === 'pomodoro') {
        label.textContent = '집중 모드';
        label.className = 'text-xs font-bold uppercase tracking-widest text-indigo-400 mb-1';
        ring.setAttribute('stroke', '#6366f1');
      } else if (mode === 'short') {
        label.textContent = '짧은 휴식';
        label.className = 'text-xs font-bold uppercase tracking-widest text-emerald-400 mb-1';
        ring.setAttribute('stroke', '#10b981');
      } else {
        label.textContent = '긴 휴식';
        label.className = 'text-xs font-bold uppercase tracking-widest text-teal-400 mb-1';
        ring.setAttribute('stroke', '#14b8a6');
      }

      document.getElementById('timer-status-hint').textContent = '준비 중';
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const str = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.getElementById('timer-display').textContent = str;

      // Update title
      const emoji = currentMode === 'pomodoro' ? '🍅' : '☕';
      document.title = `(${str}) ${emoji} 집중노트`;

      // Update ring
      const totalDuration = DURATIONS[currentMode];
      const circumference = 2 * Math.PI * 100; // ~628.3
      const progress = (totalDuration - timeLeft) / totalDuration;
      const offset = circumference * (1 - progress);
      const ring = document.getElementById('timer-ring');
      ring.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('btn-toggle-icon').className = 'fa-solid fa-pause text-sm';
      document.getElementById('btn-toggle-text').textContent = '일시 정지';
      document.getElementById('timer-status-hint').textContent = currentMode === 'pomodoro' ? '🔥 몰입 진행 중...' : '🍃 편안히 휴식하세요...';

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          if (currentMode === 'pomodoro') {
            totalFocusSeconds++;
            if (totalFocusSeconds % 10 === 0) {
              localStorage.setItem('pomodoro_total_focus_sec', String(totalFocusSeconds));
              updateStatsUI();
            }
          }
          updateTimerDisplay();
        } else {
          onSessionComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('btn-toggle-icon').className = 'fa-solid fa-play text-sm';
      document.getElementById('btn-toggle-text').textContent = '계속 하기';
      document.getElementById('timer-status-hint').textContent = '일시 정지됨';
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = DURATIONS[currentMode];
      document.getElementById('btn-toggle-icon').className = 'fa-solid fa-play text-sm';
      document.getElementById('btn-toggle-text').textContent = '시작하기';
      document.getElementById('timer-status-hint').textContent = '준비 중';
      updateTimerDisplay();
      showToast('타이머가 리셋되었습니다.');
    }

    function adjustTime(secondsDelta) {
      timeLeft = Math.max(10, timeLeft + secondsDelta);
      updateTimerDisplay();
      showToast(`시간이 조정되었습니다 (${secondsDelta > 0 ? '+' : ''}${secondsDelta / 60}분)`);
    }

    function skipToNext() {
      pauseTimer();
      if (currentMode === 'pomodoro') {
        completedSessions++;
        localStorage.setItem('pomodoro_sessions_count', String(completedSessions));
        updateStatsUI();
        if (completedSessions % 4 === 0) {
          setMode('long');
          showToast('4세션 완료! 15분 긴 휴식 시간입니다. 🛋️');
        } else {
          setMode('short');
          showToast('뽀모도로 완료! 5분 짧은 휴식 시간입니다. ☕');
        }
      } else {
        setMode('pomodoro');
        showToast('휴식 종료! 다시 25분 집중해볼까요? 🍅');
      }
    }

    function onSessionComplete() {
      pauseTimer();
      playChimeSound();

      if (currentMode === 'pomodoro') {
        completedSessions++;
        localStorage.setItem('pomodoro_sessions_count', String(completedSessions));
        localStorage.setItem('pomodoro_total_focus_sec', String(totalFocusSeconds));
        updateStatsUI();

        showToast('🎉 25분 집중 세션 완료! 정말 훌륭합니다.');
        if (completedSessions % 4 === 0) {
          setTimeout(() => setMode('long'), 1500);
        } else {
          setTimeout(() => setMode('short'), 1500);
        }
      } else {
        showToast('☕ 휴식 시간이 끝났습니다. 다음 집중 세션을 시작해보세요.');
        setTimeout(() => setMode('pomodoro'), 1500);
      }
    }

    // ----------------------------------------------------
    // Notepad & To-Do Checklist Logic
    // ----------------------------------------------------
    function initNotepad() {
      const textarea = document.getElementById('notepad-text');
      try {
        const saved = localStorage.getItem('pomodoro_notepad_content_v1');
        if (saved !== null) {
          textarea.value = saved;
        } else {
          textarea.value = `### 오늘의 집중 메모
- 

### 떠오른 아이디어
`;
        }
      } catch (e) {}
      handleNoteInput();
      renderTasks();
    }

    let saveTimeout = null;
    function handleNoteInput() {
      const textarea = document.getElementById('notepad-text');
      const val = textarea.value || '';
      document.getElementById('note-char-count').textContent = `${val.length.toLocaleString()}자 작성됨`;

      const indicator = document.getElementById('save-indicator');
      indicator.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-[10px]"></i> 저장 중...';
      indicator.className = 'text-[11px] text-amber-400 flex items-center gap-1 font-medium';

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        try {
          localStorage.setItem('pomodoro_notepad_content_v1', val);
          indicator.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-[10px]"></i> 자동저장됨';
          indicator.className = 'text-[11px] text-emerald-400 flex items-center gap-1 font-medium';
        } catch (e) {}
      }, 500);
    }

    function insertFormat(type) {
      const textarea = document.getElementById('notepad-text');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const val = textarea.value;

      let insertion = '';
      if (type === 'checkbox') {
        insertion = '\n- [ ] ';
      } else if (type === 'bullet') {
        insertion = '\n- ';
      } else if (type === 'bold') {
        insertion = '**강조 텍스트**';
      } else if (type === 'timestamp') {
        const now = new Date();
        insertion = ` [${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}] `;
      }

      textarea.value = val.substring(0, start) + insertion + val.substring(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + insertion.length;
      handleNoteInput();
    }

    function copyNote() {
      const textarea = document.getElementById('notepad-text');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(() => {
          showToast('메모 내용이 클립보드에 복사되었습니다! 📋');
        });
      } else {
        showToast('클립보드 복사를 지원하지 않는 브라우저입니다.');
      }
    }

    function downloadNote() {
      const textarea = document.getElementById('notepad-text');
      const blob = new Blob([textarea.value], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `집중노트_${new Date().toISOString().slice(0,10)}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('메모 파일이 다운로드되었습니다.');
    }

    function clearNote() {
      if (confirm('메모 내용을 정말 모두 지우시겠습니까?')) {
        const textarea = document.getElementById('notepad-text');
        textarea.value = '';
        handleNoteInput();
        showToast('메모가 비워졌습니다.');
      }
    }

    // Task list CRUD
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      const counter = document.getElementById('task-counter');
      if (!container) return;

      const completed = tasks.filter(t => t.done).length;
      counter.textContent = `${completed}/${tasks.length} 완료`;

      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="text-[11px] text-slate-500 py-1 text-center">
            등록된 할 일이 없습니다. 위 입력창에서 추가해보세요!
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map((t, idx) => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800/80 hover:border-slate-700 transition-colors gap-2">
          <label class="flex items-center gap-2 flex-1 cursor-pointer select-none">
            <input
              type="checkbox"
              ${t.done ? 'checked' : ''}
              onchange="toggleTask(${idx})"
              class="w-3.5 h-3.5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800 cursor-pointer"
            />
            <span class="text-xs ${t.done ? 'line-through text-slate-500 font-normal' : 'text-slate-200 font-medium'}">
              ${escapeHtml(t.text)}
            </span>
          </label>
          <button onclick="deleteTask(${idx})" class="text-slate-500 hover:text-rose-400 p-1 text-[11px] transition-colors" title="삭제">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      `).join('');
    }

    function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('new-task-input');
      const text = (input.value || '').trim();
      if (!text) return;

      tasks.push({ text, done: false, createdAt: Date.now() });
      input.value = '';
      saveTasks();
      renderTasks();
      showToast('할 일이 추가되었습니다! 🎯');
    }

    function toggleTask(idx) {
      if (tasks[idx]) {
        tasks[idx].done = !tasks[idx].done;
        saveTasks();
        renderTasks();
        if (tasks[idx].done) {
          showToast('할 일 완료! 멋져요 🎉');
        }
      }
    }

    function deleteTask(idx) {
      tasks.splice(idx, 1);
      saveTasks();
      renderTasks();
    }

    function saveTasks() {
      try {
        localStorage.setItem('pomodoro_tasks_v1', JSON.stringify(tasks));
      } catch (e) {}
    }

    function copyShareUrl() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('페이지 주소가 복사되었습니다! 🔗');
        });
      } else {
        showToast(window.location.href);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize
    updateStatsUI();
    updateTimerDisplay();
    initNotepad();
  </script>
</body>
</html>
